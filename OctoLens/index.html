<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RepoHug – See what makes a developer tick</title>
  <meta name="description" content="Peek into a developer's projects, languages, stars and activity. Enter a GitHub username and RepoHug shows you the interesting parts." />

  <!-- Set the theme BEFORE the page paints, so dark-mode visitors don't see a white flash. -->
  <script>
    (function () {
      let theme = null;
      // try/catch: localStorage can be blocked (e.g. some private modes)
      try { theme = localStorage.getItem("theme"); } catch (e) { }
      if (theme !== "dark" && theme !== "light") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header class="navbar">
    <a class="navbar__brand" href="index.html" aria-label="RepoHug home"></a>
      <!-- LOGO SLOT: <img src="logo.svg" alt="" width="28" height="28" /> -->
      <span class="navbar__wordmark">.RepoHug</span>
    </a>

    <nav aria-label="Main">
      <ul class="navbar__links">
        <li><a href="About.html">About</a></li>
        <li><a href="https://github.com" target="_blank" rel="noopener noreferrer">Github</a></li>
        <li>
          <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch to dark theme">
            <!-- Both icons live in the HTML; CSS shows the right one for the current theme -->
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" class="hero__title">See what makes a developer tick.</h1>

      <p class="hero__text">
        Peek into projects, languages, stars, and activity without digging
        through endless repositories. Just drop in a username and
        <strong class="brand">.RepoHug</strong> brings the interesting stuff to you.
      </p>

      <form class="search" id="search-form" role="search" novalidate>
        <label for="github-input" class="visually-hidden">GitHub username or profile URL</label>

        <div class="search__field">
          <input
            id="github-input"
            class="search__input"
            type="text"
            placeholder="Enter Github Username or Url"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
          <button type="submit" class="search__submit" aria-label="Search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
          </button>
          <span class="search__avatar" id="search-avatar" aria-hidden="true">A</span>
        </div>

        <!-- Empty until JS has something to say. role="alert" makes screen readers announce it. -->
        <p class="search__error" id="search-error" role="alert" hidden></p>
      </form>

      <p class="hero__status" id="search-status" aria-live="polite" hidden></p>
    </section>
  </main>

</body>
</html>
